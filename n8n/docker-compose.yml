# n8n local para BAKI.
# Arrancar:  docker compose up -d      (desde esta carpeta)
# Parar:     docker compose down
# Actualizar: docker compose pull; docker compose up -d
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      # Solo accesible desde este ordenador (no desde la red local).
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      # Flujos, credenciales cifradas y ejecuciones (persisten aunque se borre el contenedor).
      - n8n_data:/home/node/.n8n
      # Carpeta compartida: lo que pongas en BAKI\n8n\archivos lo ve n8n en /files.
      - ./archivos:/files

volumes:
  n8n_data:
